{% extends "base.html" %}
{% block title %}AutoDrive - Choose a New Password{% endblock %}
{% block content %}
<div class="login-container">
  <div class="login-card">
    <h1>Choose a new password</h1>
    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="password">New password (8+ characters)</label>
      <input type="password" id="password" name="password" minlength="8" required>
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" name="confirm" minlength="8" required>
      <button type="submit" class="login-button">Update password</button>
    </form>
    <p class="login-footer"><a href="{{ url_for('auth.login') }}">Back to login</a></p>
  </div>
</div>
{% endblock %}
