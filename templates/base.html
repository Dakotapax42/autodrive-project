<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}AutoDrive{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar">
        <a href="{{ url_for('inventory.cars') }}" class="logo">AutoDrive</a>

        <div class="nav-links">
            <a href="{{ url_for('inventory.cars') }}">Home</a>
            <a href="{{ url_for('inventory.cars') }}">Inventory</a>

            {% if session.get('user_id') %}
                <!-- Dynamic appointment link based on user role -->
                {% if session.get('role') == 'Employee' %}
                    <a href="{{ url_for('scheduling.view_appointments') }}">Master Calendar</a>
                {% else %}
                    <a href="{{ url_for('scheduling.view_appointments') }}">My Appointments</a>
                {% endif %}

                <!-- Switch to Logout when authenticated -->
                <a href="{{ url_for('auth.logout') }}">Logout</a>
            {% else %}
                <!-- Show Login when logged out -->
                <a href="{{ url_for('auth.login') }}">Login</a>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 AutoDrive. All rights reserved.</p>
    </footer>

</body>
</html>
