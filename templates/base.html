
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}AutoDrive{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar">
        <a href="/" class="logo">AutoDrive</a>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/cars">Inventory</a>
            <a href="/login">Login</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 AutoDrive. All rights reserved.</p>
    </footer>

</body>
</html>
