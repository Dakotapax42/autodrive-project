{% extends "base.html" %}
{% block title %}AutoDrive - Forgot Password{% endblock %}
{% block content %}
<div class="login-container">
  <div class="login-card">
    <h1>Reset your password</h1>
    <p class="login-subtitle">Enter your account email and we will send you a reset link.</p>
    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
      <button type="submit" class="login-button">Send reset link</button>
    </form>
    <p class="login-footer"><a href="{{ url_for('auth.login') }}">Back to login</a></p>
  </div>
</div>
{% endblock %}
